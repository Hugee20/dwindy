[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dwindy"
version = "0.1.0"
description = "Small offline CPU-first terminal conversational runtime"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = ["llama-cpp-python==0.3.35"]

[project.optional-dependencies]
eval = ["psutil>=5.9,<8"]

[project.scripts]
dwindy = "dwindy.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
