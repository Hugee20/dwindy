# Copy to api.local.toml. Model settings remain in config.local.toml.
host = "127.0.0.1"
port = 8000
allow_non_loopback = false
allowed_hosts = ["127.0.0.1", "localhost", "::1"]
allowed_origins = []
token_env = "DWINDY_API_TOKEN"
max_conversations = 16
conversation_idle_seconds = 1800
max_request_bytes = 65536
# Non-loopback additionally requires a token and an existing TLS certificate/key.
# ssl_certfile = "local/cert.pem"
# ssl_keyfile = "local/key.pem"

# Opt-in: completed conversations are saved UNENCRYPTED on this server.
# Omit database_path for unchanged ephemeral operation. Paths resolve here.
# database_path = "data/dwindy.sqlite3"
# database_max_mib = 128

# Optional, separately built local-document index. Stop server before syncing it.
# retrieval_index_path = "data/retrieval.sqlite3"
# retrieval_context_tokens = 768 # Provisional incremental allowance, including guidance.
# With an index, automatic context selection is the default. Set "off" to require explicit
# retrieval=true per request (the M6/M7 behavior). "on" is not accepted here.
# retrieval_default = "auto"
